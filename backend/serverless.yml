service: arquifusion-platform
frameworkVersion: '4'
package:
  individually: true
provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  # Shared LabRole compatibility mode. Functions may override this with a pre-existing role ARN.
  iam:
    role: ${env:AWS_LAMBDA_ROLE_ARN}
  httpApi:
    cors:
      allowedOrigins: ['${env:WEB_ORIGIN}']
      allowedHeaders: [content-type, authorization, x-tenant-id, idempotency-key, x-correlation-id]
      allowedMethods: [GET, POST, OPTIONS]
    authorizers:
      cognito:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: ${env:COGNITO_ISSUER}
        audience: ['${env:COGNITO_AUDIENCE}']
  environment:
    STORAGE_MODE: cloud
    AUTH_MODE: cognito
    TENANTS_TABLE: ${env:TENANTS_TABLE}
    COGNITO_ISSUER: ${env:COGNITO_ISSUER}
    COGNITO_AUDIENCE: ${env:COGNITO_AUDIENCE}
    WEB_ORIGIN: ${env:WEB_ORIGIN}
functions:
  health:
    handler: dist/api/domains/platform.health
    role: ${env:HEALTH_ROLE_ARN, ${env:AWS_LAMBDA_ROLE_ARN}}
    events:
      - httpApi: {path: /health, method: GET}
  listTenants:
    handler: dist/api/domains/platform.listTenants
    role: ${env:TENANT_READ_ROLE_ARN, ${env:AWS_LAMBDA_ROLE_ARN}}
    events:
      - httpApi: {path: /tenants, method: GET, authorizer: {name: cognito, scopes: [arquifusion/read]}}
  createTenant:
    handler: dist/api/domains/platform.createTenant
    role: ${env:TENANT_WRITE_ROLE_ARN, ${env:AWS_LAMBDA_ROLE_ARN}}
    events:
      - httpApi: {path: /tenants, method: POST, authorizer: {name: cognito, scopes: [arquifusion/write]}}
resources:
  Resources:
    # Existing machine data is retained; the tenant-keyed table is the active fleet store.
    LegacyMachinesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${env:LEGACY_MACHINES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions: [{AttributeName: machineId, AttributeType: S}]
        KeySchema: [{AttributeName: machineId, KeyType: HASH}]
    MachinesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${env:MACHINES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
        KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
        PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
    TenantsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${env:TENANTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}, {AttributeName: gsi1pk, AttributeType: S}, {AttributeName: gsi1sk, AttributeType: S}]
        KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
        GlobalSecondaryIndexes:
          - IndexName: ByUser
            KeySchema: [{AttributeName: gsi1pk, KeyType: HASH}, {AttributeName: gsi1sk, KeyType: RANGE}]
            Projection: {ProjectionType: ALL}
        PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
    TasksTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${env:TASKS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
        KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
        PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
    UploadsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${env:UPLOADS_BUCKET}
        PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
        OwnershipControls:
          Rules: [{ObjectOwnership: BucketOwnerEnforced}]
    UploadsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: {Ref: UploadsBucket}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: DenyInsecureTransport
              Effect: Deny
              Principal: '*'
              Action: s3:*
              Resource:
                - {Fn::Sub: 'arn:${AWS::Partition}:s3:::${UploadsBucket}'}
                - {Fn::Sub: 'arn:${AWS::Partition}:s3:::${UploadsBucket}/*'}
              Condition: {Bool: {aws:SecureTransport: 'false'}}
  Outputs:
    HttpApiId:
      Value: {Ref: HttpApi}
      Export: {Name: 'arquifusion-${sls:stage}-HttpApiId'}
    MachinesTableName:
      Value: ${env:MACHINES_TABLE}
      Export: {Name: 'arquifusion-${sls:stage}-MachinesTable'}
    TenantsTableName:
      Value: ${env:TENANTS_TABLE}
      Export: {Name: 'arquifusion-${sls:stage}-TenantsTable'}
    TasksTableName:
      Value: ${env:TASKS_TABLE}
      Export: {Name: 'arquifusion-${sls:stage}-TasksTable'}
    UploadsBucketName:
      Value: ${env:UPLOADS_BUCKET}
      Export: {Name: 'arquifusion-${sls:stage}-UploadsBucket'}
