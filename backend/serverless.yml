service: arquifusion-intelligence
frameworkVersion: '4'
provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  httpApi:
    cors:
      allowedOrigins: ['*']
      allowedHeaders: [content-type]
      allowedMethods: [GET, POST, OPTIONS]
  environment:
    STORAGE_MODE: cloud
    MACHINES_TABLE: ${self:service}-${sls:stage}-machines
    UPLOADS_BUCKET: ${self:service}-${sls:stage}-${env:AWS_ACCOUNT_ID}-imports
  # Supply the existing LabRole ARN explicitly; the project never creates IAM roles.
  iam:
    role: ${env:AWS_LAMBDA_ROLE_ARN}
functions:
  health:
    handler: dist/api/handlers.health
    events:
      - httpApi: {path: /health, method: GET}
  ingestCsv:
    handler: dist/api/handlers.ingestCsv
    events:
      - httpApi: {path: /ingest/csv, method: POST}
  ingestJson:
    handler: dist/api/handlers.ingestJson
    events:
      - httpApi: {path: /ingest/json, method: POST}
  listMachines:
    handler: dist/api/handlers.listMachines
    events:
      - httpApi: {path: /machines, method: GET}
  getMachine:
    handler: dist/api/handlers.getMachine
    events:
      - httpApi: {path: '/machines/{machineId}', method: GET}
  metrics:
    handler: dist/api/handlers.metrics
    events:
      - httpApi: {path: /metrics, method: GET}
  intelligence:
    handler: dist/api/handlers.intelligence
    events:
      - httpApi: {path: /intelligence/recommendations, method: GET}
resources:
  Resources:
    MachinesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.MACHINES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions: [{AttributeName: machineId, AttributeType: S}]
        KeySchema: [{AttributeName: machineId, KeyType: HASH}]
    UploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.UPLOADS_BUCKET}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
