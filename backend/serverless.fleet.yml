service: arquifusion-fleet
frameworkVersion: '4'
package: {individually: true}
provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  iam:
    role: ${env:AWS_LAMBDA_ROLE_ARN}
  httpApi:
    id: ${env:HTTP_API_ID}
    authorizers:
      cognito:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: ${env:COGNITO_ISSUER}
        audience: ['${env:COGNITO_AUDIENCE}']
  environment:
    STORAGE_MODE: cloud
    AUTH_MODE: cognito
    MACHINES_TABLE: ${env:MACHINES_TABLE}
    TENANTS_TABLE: ${env:TENANTS_TABLE}
    COGNITO_ISSUER: ${env:COGNITO_ISSUER}
    COGNITO_AUDIENCE: ${env:COGNITO_AUDIENCE}
    WEB_ORIGIN: ${env:WEB_ORIGIN}
functions:
  listMachines:
    handler: dist/api/domains/fleet.listMachines
    role: ${env:FLEET_READ_ROLE_ARN, ${env:AWS_LAMBDA_ROLE_ARN}}
    events: [{httpApi: {path: /machines, method: GET, authorizer: {name: cognito, scopes: [arquifusion/read]}}}]
  getMachine:
    handler: dist/api/domains/fleet.getMachine
    role: ${env:FLEET_READ_ROLE_ARN, ${env:AWS_LAMBDA_ROLE_ARN}}
    events: [{httpApi: {path: '/machines/{machineId}', method: GET, authorizer: {name: cognito, scopes: [arquifusion/read]}}}]
  metrics:
    handler: dist/api/domains/fleet.metrics
    role: ${env:FLEET_READ_ROLE_ARN, ${env:AWS_LAMBDA_ROLE_ARN}}
    events: [{httpApi: {path: /metrics, method: GET, authorizer: {name: cognito, scopes: [arquifusion/read]}}}]
