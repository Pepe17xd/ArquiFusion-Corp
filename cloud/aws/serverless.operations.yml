service: arquifusion-operations
frameworkVersion: '4'
package: {individually: true}
build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    platform: node
    target: node24
    format: cjs
provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  iam:
    role: ${env:AWS_LAMBDA_ROLE_ARN}
  httpApi:
    id: ${env:HTTP_API_ID}
  environment:
    STORAGE_MODE: cloud
    AUTH_MODE: cognito
    MACHINES_TABLE: ${env:MACHINES_TABLE}
    TENANTS_TABLE: ${env:TENANTS_TABLE}
    OPERATIONS_TABLE: ${env:OPERATIONS_TABLE, 'arquifusion-operations-${sls:stage}'}
    OPERATIONS_STATE_MACHINE_ARN: arn:aws:states:${aws:region}:${env:AWS_ACCOUNT_ID}:stateMachine:arquifusion-operations-${sls:stage}-anomaly-processing
    COGNITO_ISSUER: ${env:COGNITO_ISSUER}
    COGNITO_AUDIENCE: ${env:COGNITO_AUDIENCE}
    WEB_ORIGIN: ${env:WEB_ORIGIN}
    INTELLIGENCE_SERVICE_URL: ${env:INTELLIGENCE_SERVICE_URL, ''}
    INTELLIGENCE_TIMEOUT_MS: '25000'
functions:
  telemetryBatch:
    handler: src/api/domains/operations.telemetryBatch
    role: ${env:OPERATIONS_INGEST_ROLE_ARN}
    timeout: 30
    events: [{httpApi: {path: /telemetry/batch, method: POST, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/write]}}}]
  telemetry:
    handler: src/api/domains/operations.telemetry
    role: ${env:OPERATIONS_READ_ROLE_ARN}
    events: [{httpApi: {path: /telemetry, method: GET, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/read]}}}]
  latestTelemetry:
    handler: src/api/domains/operations.latestTelemetry
    role: ${env:OPERATIONS_READ_ROLE_ARN}
    events: [{httpApi: {path: /telemetry/latest, method: GET, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/read]}}}]
  anomalies:
    handler: src/api/domains/operations.anomalies
    role: ${env:OPERATIONS_READ_ROLE_ARN}
    events: [{httpApi: {path: /anomalies, method: GET, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/read]}}}]
  getAnomaly:
    handler: src/api/domains/operations.getAnomaly
    role: ${env:OPERATIONS_READ_ROLE_ARN}
    events: [{httpApi: {path: '/anomalies/{anomalyId}', method: GET, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/read]}}}]
  explainAnomaly:
    handler: src/api/domains/operations.explainAnomaly
    role: ${env:OPERATIONS_READ_ROLE_ARN}
    timeout: 120
    events: [{httpApi: {path: '/anomalies/{anomalyId}/explanation', method: POST, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/write]}}}]
  getAnomalyRules:
    handler: src/api/domains/operations.getAnomalyRules
    role: ${env:OPERATIONS_READ_ROLE_ARN}
    events: [{httpApi: {path: /anomaly-rules, method: GET, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/read]}}}]
  putAnomalyRules:
    handler: src/api/domains/operations.putAnomalyRules
    role: ${env:OPERATIONS_ADMIN_ROLE_ARN}
    events: [{httpApi: {path: /anomaly-rules, method: PUT, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/write]}}}]
  incidents:
    handler: src/api/domains/operations.incidents
    role: ${env:OPERATIONS_READ_ROLE_ARN}
    events: [{httpApi: {path: /incidents, method: GET, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/read]}}}]
  updateIncident:
    handler: src/api/domains/operations.updateIncident
    role: ${env:OPERATIONS_WRITE_ROLE_ARN}
    events: [{httpApi: {path: '/incidents/{incidentId}', method: PATCH, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/write]}}}]
  maintenanceOrders:
    handler: src/api/domains/operations.maintenanceOrders
    role: ${env:OPERATIONS_READ_ROLE_ARN}
    events: [{httpApi: {path: /maintenance/orders, method: GET, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/read]}}}]
  updateMaintenanceOrder:
    handler: src/api/domains/operations.updateMaintenanceOrder
    role: ${env:OPERATIONS_WRITE_ROLE_ARN}
    events: [{httpApi: {path: '/maintenance/orders/{workOrderId}', method: PATCH, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/write]}}}]
  operationalEvents:
    handler: src/api/domains/operations.operationalEvents
    role: ${env:OPERATIONS_READ_ROLE_ARN}
    events: [{httpApi: {path: /operations/events, method: GET, authorizer: {id: '${env:HTTP_API_AUTHORIZER_ID}', scopes: [arquifusion/read]}}}]
  processAnomaly:
    handler: src/api/domains/operations.processAnomaly
    role: ${env:OPERATIONS_WORKER_ROLE_ARN}
    timeout: 30
resources:
  Resources:
    OperationalRecordsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${env:OPERATIONS_TABLE, 'arquifusion-operations-${sls:stage}'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - {AttributeName: pk, AttributeType: S}
          - {AttributeName: sk, AttributeType: S}
          - {AttributeName: gsi1pk, AttributeType: S}
          - {AttributeName: gsi1sk, AttributeType: S}
          - {AttributeName: gsi2pk, AttributeType: S}
          - {AttributeName: gsi2sk, AttributeType: S}
        KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
        GlobalSecondaryIndexes:
          - IndexName: ByTenantMachine
            KeySchema: [{AttributeName: gsi1pk, KeyType: HASH}, {AttributeName: gsi1sk, KeyType: RANGE}]
            Projection: {ProjectionType: ALL}
          - IndexName: ByTenantType
            KeySchema: [{AttributeName: gsi2pk, KeyType: HASH}, {AttributeName: gsi2sk, KeyType: RANGE}]
            Projection: {ProjectionType: ALL}
        TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
        PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
    AnomalyProcessingStateMachine:
      Type: AWS::StepFunctions::StateMachine
      Properties:
        StateMachineName: arquifusion-operations-${sls:stage}-anomaly-processing
        StateMachineType: STANDARD
        RoleArn: ${env:OPERATIONS_STEP_FUNCTIONS_ROLE_ARN}
        Definition:
          StartAt: ProcessAnomaly
          States:
            ProcessAnomaly:
              Type: Task
              Resource: {Fn::GetAtt: [ProcessAnomalyLambdaFunction, Arn]}
              Retry:
                - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, States.Timeout]
                  IntervalSeconds: 2
                  MaxAttempts: 3
                  BackoffRate: 2
              Catch:
                - ErrorEquals: [States.ALL]
                  ResultPath: $.workflowError
                  Next: AnomalyProcessingFailed
              End: true
            AnomalyProcessingFailed:
              Type: Fail
              Error: AnomalyProcessingFailed
              Cause: Incident and maintenance records were not fully committed.
  Outputs:
    OperationsTableName:
      Value: ${env:OPERATIONS_TABLE, 'arquifusion-operations-${sls:stage}'}
    AnomalyProcessingStateMachineArn:
      Value: {Ref: AnomalyProcessingStateMachine}
