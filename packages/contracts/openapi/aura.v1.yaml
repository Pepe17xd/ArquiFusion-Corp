openapi: 3.1.0
info:
  title: ArquiFusion AURA API
  version: 1.0.0
  description: >-
    Tenant-scoped technician assignment, stock, reservations and human-confirmed incident coordination.
    Responses use the existing {data: ...} envelope. tenantId is derived from the verified Cognito access token;
    request bodies do not accept tenantId. No endpoint exposes a Step Functions task token.
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    variables: {apiId: {default: api-id}, region: {default: us-east-1}}
security: [{cognitoAccessToken: []}]
paths:
  /technicians:
    get:
      operationId: listAuraTechnicians
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {description: Tenant-scoped technician page}}
    post:
      operationId: saveAuraTechnician
      description: Create a technician, or replace an existing profile when If-Match contains its current version.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Technician'}
            example:
              technicianId: tech-042
              displayName: Elena Rojas
              specialties: [hydraulics, excavator]
              skills: [{code: hydraulic-diagnostics, level: 4}]
              availability: available
              maxConcurrentAssignments: 2
              shifts: [{daysOfWeek: [1, 2, 3, 4, 5], startTime: '08:00', endTime: '17:00', timeZone: America/Lima}]
              coordinates: {latitude: -12.0464, longitude: -77.0428, datum: WGS84}
              cognitoSub: user-pool-subject
      responses: {'200': {description: Saved technician}, '400': {description: Invalid profile or tenantId in body}, '409': {description: Version conflict or duplicate technician}}
  /technicians/{technicianId}:
    parameters: [{$ref: '#/components/parameters/TechnicianId'}]
    get:
      operationId: getAuraTechnician
      responses: {'200': {description: Technician profile}, '404': {description: Technician not found}}
    patch:
      operationId: archiveAuraTechnician
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses: {'200': {description: Technician archived (soft delete)}, '409': {description: Version conflict}}
  /machines/{machineId}/coordinates:
    put:
      operationId: putVerifiedMachineCoordinates
      parameters: [{$ref: '#/components/parameters/MachineId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [coordinates], properties: {coordinates: {$ref: '#/components/schemas/Coordinates'}}}
            example: {coordinates: {latitude: -12.0464, longitude: -77.0428, datum: WGS84}}
      responses: {'200': {description: Verified WGS84 machine location}, '404': {description: Machine not found}}
  /inventory/parts:
    get:
      operationId: listParts
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {description: Tenant part catalog page}}
    post:
      operationId: createPart
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Part'}
            example: {partId: filter-044, name: Hydraulic filter, sku: HF-044, unit: each, minimumStock: 4}
      responses: {'200': {description: Created part}}
  /inventory/stock:
    get:
      operationId: listStock
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {description: Stock balances include partId, locationId, onHand, reserved and version}}
  /inventory/alerts:
    get:
      operationId: listInventoryAlerts
      description: Returns observed stock balances below the configured minimum; no forecast is inferred.
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {description: Tenant-scoped warning and critical stock alerts}}
  /inventory/movements:
    get:
      operationId: listInventoryMovements
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {description: Auditable inventory movement page}}
    post:
      operationId: createInventoryMovement
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Movement'}
            example: {partId: filter-044, locationId: depot-lima, quantity: 12, kind: receipt, reason: Purchase order PO-501}
      responses: {'200': {description: Movement and stock committed atomically}, '409': {description: Insufficient stock, duplicate movement or idempotency conflict}}
  /maintenance/orders/{workOrderId}/reservations:
    post:
      operationId: reserveMaintenancePart
      parameters: [{$ref: '#/components/parameters/WorkOrderId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReservationRequest'}
            example: {partId: filter-044, locationId: depot-lima, quantity: 2, reason: Corrective maintenance}
      responses: {'200': {description: Stock reservation committed atomically}, '409': {description: Insufficient stock or duplicate idempotency key}}
  /inventory/reservations/{reservationId}/release:
    post:
      operationId: releaseInventoryReservation
      parameters: [{$ref: '#/components/parameters/ReservationId'}]
      responses: {'200': {description: Released reservation; repeated release is idempotent}, '409': {description: Concurrent stock change}}
  /assignments/optimize:
    post:
      operationId: optimizeIncidentAssignments
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      description: >-
        Calculates a deterministic global assignment using the Hungarian algorithm. Only open/acknowledged incidents
        with an active maintenance order are eligible. Skill and availability are hard constraints. Distance is included
        only when both endpoints have verified WGS84 coordinates; no travel time is inferred. Proposed assignments start
        the separate AURA Standard workflow when a technician is available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [incidentIds]
              properties:
                incidentIds: {type: array, minItems: 1, maxItems: 25, uniqueItems: true, items: {type: string}}
                requirements: {type: object, additionalProperties: {type: array, maxItems: 12, items: {type: object, additionalProperties: false, required: [code, minLevel], properties: {code: {type: string}, minLevel: {type: integer, minimum: 1, maximum: 5}}}}}
            example: {incidentIds: [incident-101, incident-102], requirements: {incident-101: [{code: hydraulic-diagnostics, minLevel: 3}]}}
      responses: {'200': {description: Assignments with candidate costs, explanation, workflowStarted and replayed}, '409': {description: Incident already coordinated or idempotency conflict}, '503': {description: Proposal persisted; retry the same idempotency key to resume dispatch}}
  /assignments:
    get:
      operationId: listAssignments
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {description: Assignment proposals and workflow states}}
  /assignments/{assignmentId}:
    get:
      operationId: getAssignment
      parameters: [{$ref: '#/components/parameters/AssignmentId'}]
      responses: {'200': {description: Assignment, candidates and audit state}, '404': {description: Assignment not found}}
  /assignments/{assignmentId}/response:
    post:
      operationId: respondToAssignmentCallback
      parameters: [{$ref: '#/components/parameters/AssignmentId'}]
      description: Assigned technician or tenant admin can accept/reject confirmation or submit the completed intervention. Callback tokens remain server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [phase, decision]
                  properties:
                    phase: {const: confirmation}
                    decision: {enum: [accepted, rejected]}
                    reason: {type: string, maxLength: 300}
                - type: object
                  additionalProperties: false
                  required: [phase, occurredAt, notes]
                  properties:
                    phase: {const: intervention}
                    occurredAt: {type: string, format: date-time}
                    notes: {type: string, maxLength: 2000}
            examples:
              accepted: {value: {phase: confirmation, decision: accepted}}
              completed: {value: {phase: intervention, occurredAt: '2026-11-15T17:10:00Z', notes: Replaced the hydraulic filter and verified pressure}}
      responses: {'200': {description: Callback accepted (not a notification delivery receipt)}, '403': {description: Actor is not the assigned technician or tenant admin}, '409': {description: Callback already submitted or expired}}
  /assignments/policy:
    get:
      operationId: getAssignmentPolicy
      responses: {'200': {description: Tenant configured policy or explicit unconfigured defaults}}
    put:
      operationId: putAssignmentPolicy
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignmentPolicy'}
            example: {weights: {skill: 0.45, workload: 0.35, distance: 0.2}, maxDistanceKm: 250, unmatchedPenalty: {info: 0.6, warning: 0.78, critical: 0.94}}
      responses: {'200': {description: Saved policy with incremented version}, '409': {description: Concurrent policy update}}
  /operations/kpis:
    get:
      operationId: getOperationsKpis
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses: {'200': {description: MTTR, recurrence counts, response SLA unavailable without configuration, and downtime with explicit unavailable reason}}
  /aura/events:
    get:
      operationId: listAuraEvents
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {description: Persisted AURA audit events; NotificationRequested means recorded, not delivered}}
components:
  securitySchemes:
    cognitoAccessToken: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 4096}}
    IfMatch: {name: If-Match, in: header, required: false, schema: {type: integer, minimum: 1}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
    TechnicianId: {name: technicianId, in: path, required: true, schema: {type: string}}
    MachineId: {name: machineId, in: path, required: true, schema: {type: string}}
    WorkOrderId: {name: workOrderId, in: path, required: true, schema: {type: string}}
    ReservationId: {name: reservationId, in: path, required: true, schema: {type: string}}
    AssignmentId: {name: assignmentId, in: path, required: true, schema: {type: string}}
  schemas:
    Coordinates:
      type: object
      additionalProperties: false
      required: [latitude, longitude, datum]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        datum: {const: WGS84}
    Technician:
      type: object
      additionalProperties: false
      required: [technicianId, displayName, specialties, skills, availability, maxConcurrentAssignments, shifts]
      properties:
        technicianId: {type: string, minLength: 1, maxLength: 100}
        displayName: {type: string, minLength: 1, maxLength: 120}
        specialties: {type: array, minItems: 1, maxItems: 20, items: {type: string, maxLength: 64}, uniqueItems: true}
        skills: {type: array, minItems: 1, maxItems: 30, items: {type: object, additionalProperties: false, required: [code, level], properties: {code: {type: string}, level: {type: integer, minimum: 1, maximum: 5}}}}
        availability: {enum: [available, unavailable]}
        maxConcurrentAssignments: {type: integer, minimum: 1, maximum: 20}
        shifts: {type: array, minItems: 1, maxItems: 7, items: {type: object, additionalProperties: false, required: [daysOfWeek, startTime, endTime, timeZone], properties: {daysOfWeek: {type: array, items: {type: integer, minimum: 0, maximum: 6}}, startTime: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$'}, endTime: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$'}, timeZone: {type: string}}}}
        coordinates: {$ref: '#/components/schemas/Coordinates'}
        cognitoSub: {type: string, maxLength: 128}
    Part:
      type: object
      additionalProperties: false
      required: [partId, name, sku, unit, minimumStock]
      properties:
        partId: {type: string}
        name: {type: string, maxLength: 160}
        sku: {type: string, maxLength: 80}
        unit: {type: string, maxLength: 32}
        minimumStock: {type: number, minimum: 0, maximum: 1000000}
    Movement:
      type: object
      additionalProperties: false
      required: [partId, locationId, quantity, kind, reason]
      properties:
        partId: {type: string}
        locationId: {type: string}
        quantity: {type: number, exclusiveMinimum: -1000000, maximum: 1000000, not: {const: 0}}
        kind: {enum: [receipt, adjustment]}
        reason: {type: string, maxLength: 500}
    ReservationRequest:
      type: object
      additionalProperties: false
      required: [partId, locationId, quantity, reason]
      properties:
        partId: {type: string}
        locationId: {type: string}
        quantity: {type: number, exclusiveMinimum: 0, maximum: 1000000}
        reason: {type: string, maxLength: 500}
    AssignmentPolicy:
      type: object
      additionalProperties: false
      required: [weights, maxDistanceKm, unmatchedPenalty]
      properties:
        weights: {type: object, additionalProperties: false, required: [skill, workload, distance], properties: {skill: {type: number, minimum: 0, maximum: 1}, workload: {type: number, minimum: 0, maximum: 1}, distance: {type: number, minimum: 0, maximum: 1}}}
        maxDistanceKm: {type: number, exclusiveMinimum: 0, maximum: 20000}
        unmatchedPenalty: {type: object, additionalProperties: false, required: [info, warning, critical], properties: {info: {type: number, minimum: 0, maximum: 1}, warning: {type: number, minimum: 0, maximum: 1}, critical: {type: number, minimum: 0, maximum: 1}}}
